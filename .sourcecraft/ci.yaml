on:
  push:
    - workflows: [build-and-deploy]
      filter:
        branches: ["main"]

workflows:
  build-and-deploy:
    tasks:
      - build-and-publish

tasks:
  - name: build-and-publish
    cubes:
      - name: build-and-deploy-cube
        image: node:22
        env:
          VITE_API_URL: "https://brightcity.onrender.com"
        script:
          - apt-get update && apt-get install -y git
          - cd web_app/frontend
          - npm ci
          - npm run build
          - cd ../..
          - rm -rf /tmp/site-dist && mkdir -p /tmp/site-dist
          - cp -r web_app/frontend/dist/* /tmp/site-dist/
          - git config --global user.email "ci@sourcecraft.dev"
          - git config --global user.name "SourceCraft CI"
          - git remote set-url origin https://ci:${SOURCECRAFT_TOKEN}@git.sourcecraft.dev/sourcecraft20/brightcity.git
          - git fetch origin
          - git checkout --orphan site
          - git rm -rf .
          - cp -r /tmp/site-dist/* .
          - git add .
          - git commit -m "Deploy to SourceCraft Sites"
          - git push -f origin site